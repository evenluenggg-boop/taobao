<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ system_name }}{% endblock %}</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#ff6a00; --border:#e5e7eb; --ok:#16a34a; --warn:#d97706; --danger:#dc2626; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
    header { background:linear-gradient(135deg,var(--primary),#ff9f1c); color:#fff; padding:28px 24px; }
    header .wrap, main { max-width:1180px; margin:0 auto; }
    h1,h2,h3,p { margin-top:0; }
    nav { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    nav a, .button { display:inline-flex; align-items:center; min-height:40px; padding:0 14px; border-radius:10px; border:1px solid rgba(255,255,255,.45); color:#fff; text-decoration:none; font-weight:700; }
    main { padding:28px 24px 48px; }
    .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:24px; }
    .card,.panel { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 30px rgba(31,41,55,.06); }
    .card { padding:22px; }
    .card strong { display:block; font-size:30px; line-height:1.2; }
    .muted { color:var(--muted); }
    .panel { margin-bottom:24px; overflow:hidden; }
    .panel-header { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border); }
    .panel-body { padding:22px; }
    .panel-header h2 { margin-bottom:0; font-size:20px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; font-size:14px; }
    th { background:#f9fafb; color:var(--muted); white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    input,select { width:100%; min-height:42px; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font:inherit; background:#fff; }
    label { display:block; margin-bottom:6px; font-weight:700; }
    .form-grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); align-items:end; }
    .button { border-color:var(--primary); background:var(--primary); color:#fff; cursor:pointer; justify-content:center; }
    .button.secondary { background:#fff; color:var(--text); border-color:var(--border); }
    .alert { padding:14px 16px; border-radius:12px; margin-bottom:18px; }
    .alert.ok { background:#ecfdf5; color:#166534; border:1px solid #bbf7d0; }
    .alert.error { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .links { display:flex; flex-wrap:wrap; gap:12px; }
    .links a { color:var(--primary); font-weight:700; }
    .table-wrap { overflow:auto; }
    @media (max-width:640px) { header, main { padding-left:14px; padding-right:14px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>{{ system_name }}</h1>
      <p>Excel / CSV 导入版 V1：本地上传、写入 SQLite、网页预览。</p>
      <nav aria-label="主导航">
        {% for label, href in nav_items %}<a href="{{ href }}">{{ label }}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
